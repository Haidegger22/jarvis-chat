<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Башня Старка 🗼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
h1{color:#a0d2ff;font-size:22px}
p{color:#555;font-size:14px;max-width:300px;text-align:center;line-height:1.5}
a{color:#a0d2ff;text-decoration:none;font-size:16px;background:#0f3460;padding:12px 32px;border-radius:8px;transition:background .2s}
a:hover{background:#1a4a7a}
#loading{color:#555;font-size:13px}
</style>
</head>
<body>
<h1>Башня Старка 🗼</h1>
<p>Чат с Джарвисом 🤖 и Пятницей 💚<br>Работает через терминал — просто и надёжно</p>
<a id="link" href="#">Открыть чат</a>
<div id="loading">Загрузка...</div>
<script>
fetch('tunnel.json',{cache:'no-cache'})
.then(r=>r.json())
.then(cfg=>{
  document.getElementById('link').href='https://'+cfg.tunnel;
  document.getElementById('loading').style.display='none';
})
.catch(()=>{
  document.getElementById('loading').textContent='Нет связи. Обнови страницу.';
});
</script>
</body>
</html>
