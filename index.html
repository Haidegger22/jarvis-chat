<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis Chat 🗼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;height:100vh;display:flex;flex-direction:column}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.header h1{font-size:18px;font-weight:600;flex:1}
.agent-btn{padding:6px 14px;border-radius:6px;border:1px solid #30363d;background:transparent;color:#8b949e;cursor:pointer;font-size:13px;transition:.2s}
.agent-btn.active{background:#1f6feb;color:#fff;border-color:#1f6feb}
.agent-btn.jarvis.active{background:#6e40c9;border-color:#6e40c9}
.agent-btn.friday.active{background:#238636;border-color:#238636}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;animation:fadeIn .3s}
.msg.user{background:#1f6feb;align-self:flex-end;border-bottom-right-radius:4px}
.msg.assistant{background:#21262d;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #30363d}
.msg .agent-badge{font-size:11px;opacity:.7;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.msg .time{font-size:10px;color:#8b949e;margin-top:4px;text-align:right;opacity:.6}
.mode-btn{padding:4px 10px;border-radius:6px;border:1px solid #30363d;background:transparent;color:#8b949e;cursor:pointer;font-size:11px;transition:.2s}
.mode-btn:hover{color:#e6edf3;border-color:#8b949e}
.msg .content{white-space:pre-wrap;word-break:break-word}
.msg .content code{background:#161b22;padding:2px 6px;border-radius:4px;font-size:13px}
.msg .content pre{background:#161b22;padding:10px;border-radius:6px;margin:6px 0;overflow-x:auto}
.input-area{display:flex;gap:8px;padding:12px 16px;background:#161b22;border-top:1px solid #30363d;flex-shrink:0}
.input-area input{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;color:#e6edf3;font-size:14px;outline:none;transition:.2s}
.input-area input:focus{border-color:#1f6feb}
.input-area button{background:#1f6feb;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer;transition:.2s}
.input-area button:hover{background:#388bfd}
.input-area button:disabled{opacity:.5;cursor:not-allowed}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:#8b949e;gap:8px;text-align:center}
.welcome h2{font-size:24px;color:#e6edf3}
.welcome p{font-size:14px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.typing{display:flex;gap:4px;padding:10px 14px;background:#21262d;border-radius:12px;align-self:flex-start;border:1px solid #30363d;border-bottom-left-radius:4px}
.typing span{width:8px;height:8px;background:#8b949e;border-radius:50%;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
/* Login screen */
.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#0d1117;display:flex;align-items:center;justify-content:center;z-index:9999}
.login-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:40px;width:360px;text-align:center}
.login-card h1{font-size:20px;margin-bottom:8px;color:#e6edf3}
.login-card p{color:#8b949e;font-size:14px;margin-bottom:24px}
.login-card input{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 14px;color:#e6edf3;font-size:14px;outline:none;margin-bottom:12px;box-sizing:border-box}
.login-card input:focus{border-color:#1f6feb}
.login-card button{width:100%;background:#1f6feb;color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;cursor:pointer}
.login-card button:hover{background:#388bfd}
.login-card .error{color:#f85149;font-size:13px;margin-top:8px;display:none}
.login-card .note{color:#555;font-size:11px;margin-top:16px}
</style>
</head>
<body>
<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h1>🗼 Башня Старка</h1>
    <p>Введи пароль для доступа к чату</p>
    <input type="password" id="loginPass" placeholder="Пароль" onkeydown="if(event.key==='Enter')checkPassword()">
    <button onclick="checkPassword()">Войти</button>
    <div class="error" id="loginError">Неверный пароль</div>
    <div class="note">доступ только для своих</div>
  </div>
</div>

<div class="header">
  <h1>🗼 Jarvis Chat</h1>
  <button class="agent-btn friday active" data-agent="friday" onclick="switchAgent('friday')">💚 Пятница</button>
  <button class="agent-btn jarvis" data-agent="jarvis" onclick="switchAgent('jarvis')">🤖 Джарвис</button>
  <button id="modeBtn" class="mode-btn" onclick="toggleMode()" title="Переключить режим отправки">🌊 Стрим</button>
</div>
<div class="chat" id="chat">
  <div class="welcome" id="welcome">
    <h2>🗼 Башня Старка</h2>
    <p>Выбери агента и напиши сообщение</p>
  </div>
</div>
<div class="input-area">
  <input id="input" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}">
  <button id="sendBtn" onclick="send()">➤</button>
</div>

<script>
// === Password (SHA256 of "stark-tower-2026") ===
const PASSWORD_HASH = '9f3409d1b2a38f1f3c76391344c9bb677b96228bec2cd86211b297f33b4522ea';
const API_BASE = 'https://jarvis-chat.org';

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
  const input = document.getElementById('loginPass');
  const hash = await sha256(input.value);
  if (hash === PASSWORD_HASH) {
    sessionStorage.setItem('chat_auth', '1');
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('input').focus();
  } else {
    document.getElementById('loginError').style.display = 'block';
    input.value = '';
    input.focus();
  }
}

// Auto-login on load if already authed in this session
(function() {
  if (sessionStorage.getItem('chat_auth') === '1') {
    document.getElementById('loginOverlay').style.display = 'none';
  }
})();

// === Chat logic ===
let currentAgent = 'friday';
let abortController = null;
let useStream = true;

function switchAgent(agent) {
  currentAgent = agent;
  document.querySelectorAll('.agent-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.agent-btn.${agent}`).classList.add('active');
  document.getElementById('input').focus();
}

function toggleMode() {
  useStream = !useStream;
  document.getElementById('modeBtn').textContent = useStream ? '🌊 Стрим' : '📦 Обычный';
}

function getModel() {
  return 'openclaw';
}

function getEndpoint() {
  return currentAgent === 'jarvis' ? '/v1/jarvis/completions' : '/v1/chat/completions';
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  document.getElementById('welcome')?.remove();
  document.getElementById('sendBtn').disabled = true;

  addMsg(text, 'user');
  saveHistory();

  // Typing indicator
  const typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.id = 'typing';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('chat').appendChild(typingEl);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;

  try {
    const messages = [];
    document.querySelectorAll('.msg.assistant, .msg.user').forEach(el => {
      messages.push({
        role: el.classList.contains('user') ? 'user' : 'assistant',
        content: el.querySelector('.content')?.textContent || ''
      });
    });
    if (messages.length > 0 && messages[messages.length-1].role === 'user') {
      messages.pop();
    }
    messages.push({role: 'user', content: text});

    const url = API_BASE + getEndpoint();
    const headers = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer stark-tower-2026'
    };

    if (useStream) {
      await sendStream(url, headers, messages, typingEl);
    } else {
      await sendBatch(url, headers, messages, typingEl);
    }
  } catch(e) {
    document.getElementById('typing')?.remove();
    if (e.name !== 'AbortError') {
      addMsg('Ошибка соединения: ' + e.message, 'assistant');
    }
  }
  document.getElementById('sendBtn').disabled = false;
}

async function sendStream(url, headers, messages, typingEl) {
  const body = {
    model: getModel(),
    messages: messages,
    stream: true,
    max_tokens: 8192
  };

  abortController = new AbortController();
  const response = await fetch(url, {
    method: 'POST',
    headers: headers,
    body: JSON.stringify(body),
    signal: abortController.signal
  });

  typingEl.remove();

  if (!response.ok) {
    addMsg(`Ошибка: ${response.status}${response.status === 401 ? ' — неверный пароль на сервере' : ''}`, 'assistant');
    return;
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8', {stream: true});
  let content = '';
  let buffer = '';
  const msgEl = addMsg('', 'assistant');

  let streamOk = true;
  let gotDone = false;
  while (true) {
    let chunk;
    try {
      const result = await reader.read();
      if (result.done) break;
      chunk = result.value;
    } catch(e) {
      console.error('Stream error:', e);
      streamOk = false;
      break;
    }

    buffer += decoder.decode(chunk, {stream: true});

    let idx;
    while ((idx = buffer.indexOf('\n')) !== -1) {
      const line = buffer.slice(0, idx).trim();
      buffer = buffer.slice(idx + 1);
      if (!line.startsWith('data: ')) continue;
      if (line === 'data: [DONE]') { gotDone = true; continue; }
      try {
        const json = JSON.parse(line.slice(6));
        const d = json.choices?.[0]?.delta?.content;
        if (d) { content += d; }
      } catch(e) { continue; }
    }

    if (content) {
      msgEl.querySelector('.content').textContent = content;
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }
  }

  // Process remaining buffer
  if (buffer.trim().startsWith('data: ')) {
    const line = buffer.trim();
    if (line === 'data: [DONE]') { gotDone = true; }
    else if (line.startsWith('data: ')) {
      try {
        const json = JSON.parse(line.slice(6));
        const d = json.choices?.[0]?.delta?.content;
        if (d) { content += d; }
      } catch(e) {}
    }
  }

  if (content) {
    msgEl.querySelector('.content').innerHTML = formatCode(content);
    saveHistory();
    if (!gotDone && content.length > 10) {
      showInterrupted(msgEl, content);
    }
  } else if (!streamOk) {
    // Stream failed completely — auto-fallback to non-streaming
    addMsg('⚠️ Стрим прерван. Пробую обычный режим...', 'assistant');
    msgEl.remove();
    await sendBatch(url, headers, messages, null);
  }
}

async function sendBatch(url, headers, messages, typingEl) {
  // Remove the last user message if it was already added by send()
  const body = {
    model: getModel(),
    messages: messages,
    stream: false,
    max_tokens: 8192
  };

  if (typingEl) typingEl.remove();

  // Show spinner/loading
  const loadingEl = document.createElement('div');
  loadingEl.className = 'typing';
  loadingEl.id = 'batch-loading';
  loadingEl.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('chat').appendChild(loadingEl);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;

  try {
    abortController = new AbortController();
    const response = await fetch(url, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(body),
      signal: abortController.signal,
      timeout: 300000
    });

    document.getElementById('batch-loading')?.remove();

    if (!response.ok) {
      addMsg(`Ошибка: ${response.status}`, 'assistant');
      return;
    }

    const data = await response.json();
    const content = data.choices?.[0]?.message?.content || '';
    if (content) {
      const msgEl = addMsg('', 'assistant');
      msgEl.querySelector('.content').innerHTML = formatCode(content);
      saveHistory();
    } else {
      addMsg('⚠️ Пустой ответ от сервера', 'assistant');
    }
  } catch(e) {
    document.getElementById('batch-loading')?.remove();
    throw e;
  }
}

function showInterrupted(msgEl, content) {
  // Show a banner that the response was cut short
  const banner = document.createElement('div');
  banner.style.cssText = 'text-align:center;margin:4px 0;padding:6px;background:#161b22;border:1px solid #30363d;border-radius:8px;font-size:12px;color:#8b949e';
  banner.innerHTML = '⚠️ <strong>Ответ обрезан</strong> — нестабильное соединение. ' +
    '<a href="#" onclick="continueChat();return false" style="color:#58a6ff">Продолжить</a> | ' +
    '<a href="#" onclick="rerunLastBatch();return false" style="color:#58a6ff">Отправить без стрима</a>';
  document.getElementById('chat').appendChild(banner);
}

function rerunLastBatch() {
  const msgs = [];
  document.querySelectorAll('.msg.assistant, .msg.user').forEach(el => {
    msgs.push({
      role: el.classList.contains('user') ? 'user' : 'assistant',
      content: el.querySelector('.content')?.textContent || ''
    });
  });
  // Remove last assistant message to retry
  if (msgs.length > 0 && msgs[msgs.length-1].role === 'assistant') {
    const lastMsg = document.querySelector('.chat > .msg:last-child');
    lastMsg?.remove();
    msgs.pop();
  }
  // Remove the banner
  const banner = document.querySelector('.chat > div:last-child');
  if (banner && !banner.classList.contains('msg')) banner.remove();

  // Save stream mode for this retry
  const wasStream = useStream;
  useStream = false;
  
  const url = API_BASE + getEndpoint();
  const headers = {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer stark-tower-2026'
  };
  sendBatch(url, headers, msgs, null);

  useStream = wasStream;
}

function addMsg(text, role) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.dataset.time = Date.now();

  let badge = '';
  if (role === 'assistant') {
    badge = currentAgent === 'jarvis' ? '🤖 Джарвис' : '💚 Пятница';
  }

  const ts = formatTime(Date.now());
  el.innerHTML = `
    ${role === 'assistant' ? `<div class="agent-badge">${badge}</div>` : ''}
    <div class="content">${text || ''}</div>
    <div class="time">${ts}</div>
  `;
  document.getElementById('chat').appendChild(el);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  return el;
}

function continueChat() {
  document.getElementById('input').value = 'Продолжи свой последний ответ с того места, где остановился';
  send();
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const dateStr = d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
  const timeStr = d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  if (d.toDateString() === now.toDateString()) {
    return timeStr;
  }
  return dateStr + ' ' + timeStr;
}

function formatCode(text) {
  return text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

// === History persistence ===
const STORAGE_KEY = 'jarvis_chat_history';
const MAX_MSGS = 200;

function saveHistory() {
  const msgs = [];
  document.querySelectorAll('.msg').forEach(el => {
    const role = el.classList.contains('user') ? 'user' : 'assistant';
    const agent = el.querySelector('.agent-badge')?.textContent || '';
    const text = el.querySelector('.content')?.textContent || '';
    const time = el.dataset.time || Date.now();
    msgs.push({role, agent, text, time: parseInt(time)});
  });
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs.slice(-MAX_MSGS)));
  } catch(e) {
    if (e.name === 'QuotaExceededError') localStorage.removeItem(STORAGE_KEY);
  }
}

function loadHistory() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (!data) return;
    const msgs = JSON.parse(data);
    if (!msgs.length) return;
    document.getElementById('welcome')?.remove();
    msgs.forEach(msg => {
      const el = document.createElement('div');
      el.className = 'msg ' + msg.role;
      const ts = msg.time ? formatTime(msg.time) : '';
      el.innerHTML = (msg.role === 'assistant' ? '<div class="agent-badge">' + msg.agent + '</div>' : '') + '<div class="content">' + escapeHtml(msg.text) + '</div>' + '<div class="time">' + ts + '</div>';
      document.getElementById('chat').appendChild(el);
    });
  } catch(e) {}
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadHistory();
window.addEventListener('beforeunload', saveHistory);
</script>
</body>
</html>
